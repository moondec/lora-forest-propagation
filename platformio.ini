; LoRa forest logger: tower transmitter and mobile logger for M5Stack Unit C6L
; with Unit GPS v1.1. See DESIGN.md. Hardware-free logic lives in lib/core and
; is tested on the host with `pio test -e native`.

[platformio]
default_envs = tower, mobile

[c6l]
; Same pioarduino platform as ~/Documents/3a_loracore (Arduino-ESP32 3.x).
; BLE uses the core's built-in BLE library: NimBLE-Arduino 2.2.3 does not build
; against this core for the ESP32-C6 (missing syscfg/syscfg.h).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    jgromes/RadioLib @ 7.1.2
    olikraus/U8g2 @ 2.36.5

[env:tower]
extends = c6l
build_flags = ${c6l.build_flags} -D ROLE_TOWER

[env:mobile]
extends = c6l
build_flags = ${c6l.build_flags} -D ROLE_MOBILE

[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -Wall -Wextra -D UNITY_INCLUDE_DOUBLE
